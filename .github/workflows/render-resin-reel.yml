name: Render resin printer reel

on:
  workflow_dispatch:
  push:
    paths:
      - "reels/resin-printer/timeline.json"
      - "reels/resin-printer/composition.html"
      - "reels/resin-printer/scripts/**"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reels/resin-printer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages (ffmpeg, emoji font)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji
      - name: Python packages
        run: pip install numpy scipy soundfile pillow
      - name: Playwright + Chromium
        run: npm install && npx playwright install --with-deps chromium
      - name: Render
        run: node render.mjs --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: resin-reel-mp4
          path: |
            reels/resin-printer/out/ideaspulse_resin_reel.mp4
            reels/resin-printer/out/preview_540p.mp4
