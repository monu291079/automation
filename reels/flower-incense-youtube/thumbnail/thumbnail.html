<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Anton"; src: url(../assets/fonts/Anton-Regular.ttf); }

@font-face { font-family: "Poppins"; font-weight: 900; src: url(../assets/fonts/Poppins-Black.ttf); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; background: #0B1526; font-family: Poppins, "Noto Color Emoji"; }

.t1 { font-size: 66px; color: #FAF9F5; text-shadow: 0 5px 0 rgba(0,0,0,.6); }

.emo { color: #fff; -webkit-text-fill-color: #fff; }
.pill { position: absolute; left: 48px; top: 500px; padding: 14px 30px; border-radius: 999px; font-weight: 900; font-size: 40px; color: #12213A; background: linear-gradient(180deg,#F6E2A6,#E2BE6A 50%,#B88E36); }
.logo { position: absolute; left: 48px; top: 30px; width: 74px; height: 74px; border-radius: 50%; box-shadow: 0 0 0 3px #E2BE6A; }
.brand { position: absolute; left: 136px; top: 50px; font-weight: 900; font-size: 32px; color: #FAF9F5; }
.brand b { color: #E2BE6A; }
.stamp { position: absolute; right: 40px; top: 40px; padding: 12px 26px; border: 6px solid #FF6B3D; color: #FF6B3D; border-radius: 16px; font-family: Anton; font-size: 54px; transform: rotate(6deg); background: rgba(11,21,38,.8); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(90deg,#218C87,#E2BE6A); }
